[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrakriti3d"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["requests==2.32.3", "psutil==6.0.0", "Flask==3.1.3"]

[project.optional-dependencies]
companion = ["gunicorn==23.0.0", "numpy==2.1.3", "opencv-python-headless==4.10.0.84"]
test = ["pytest==8.3.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
