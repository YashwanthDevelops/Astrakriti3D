<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
  <title id="title">Astrakriti3D eight-stage reconstruction workflow</title>
  <desc id="desc">The diagram flows left to right across the top row, then right to left across the bottom row: drone video, frame extraction, optional telemetry alignment, feature matching, camera estimation, dense reconstruction, meshing and texturing, inspection and export.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2526"/><stop offset="1" stop-color="#273536"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#89b9ad"/></marker>
  </defs>
  <rect width="1120" height="610" rx="26" fill="url(#bg)"/>
  <text x="56" y="56" fill="#a8d0c6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">FROM CAPTURE TO REVIEW</text>
  <g fill="none" stroke="#89b9ad" stroke-width="2.2" marker-end="url(#arrow)">
    <path d="M294 193h27"/><path d="M566 193h27"/><path d="M838 193h27"/><path d="M988 271v48"/>
    <path d="M864 399h-26"/><path d="M592 399h-26"/><path d="M320 399h-26"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g>
      <rect x="48" y="112" width="246" height="160" rx="18" fill="#f3f0e7"/>
      <circle cx="78" cy="143" r="17" fill="#386e6d"/><text x="78" y="148" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">01</text>
      <g transform="translate(255 143)" stroke="#386e6d" stroke-width="2" fill="none"><path d="M-13 0-4 4m22-4L4 4M-13 11-4 7m22 4L4 7"/><circle cx="-17" cy="-2" r="4"/><circle cx="17" cy="-2" r="4"/><circle cx="-17" cy="13" r="4"/><circle cx="17" cy="13" r="4"/><rect x="-4" y="2" width="8" height="9" rx="2"/></g>
      <text x="70" y="204" fill="#1b2526" font-size="21" font-weight="700">Drone video</text><text x="70" y="232" fill="#536463" font-size="15">Source capture</text>
    </g>
    <g>
      <rect x="320" y="112" width="246" height="160" rx="18" fill="#f3f0e7"/>
      <circle cx="350" cy="143" r="17" fill="#386e6d"/><text x="350" y="148" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">02</text>
      <g transform="translate(527 143)" stroke="#386e6d" stroke-width="2" fill="none"><rect x="-15" y="-10" width="26" height="20" rx="3"/><path d="M16-10v20m5-20v20m5-20v20"/></g>
      <text x="342" y="204" fill="#1b2526" font-size="21" font-weight="700">Frame extraction</text><text x="342" y="232" fill="#536463" font-size="15">Ordered, timestamped images</text>
    </g>
    <g>
      <rect x="592" y="112" width="246" height="160" rx="18" fill="#f3f0e7"/>
      <circle cx="622" cy="143" r="17" fill="#386e6d"/><text x="622" y="148" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">03</text>
      <g transform="translate(799 143)" stroke="#386e6d" stroke-width="2" fill="none"><path d="M0-13c-7 0-11 5-11 11 0 8 11 19 11 19S11 6 11-2C11-8 7-13 0-13Z"/><circle cy="-2" r="3"/></g>
      <text x="614" y="198" fill="#1b2526" font-size="18" font-weight="700">Optional telemetry</text><text x="614" y="223" fill="#1b2526" font-size="18" font-weight="700">alignment</text><text x="614" y="249" fill="#536463" font-size="14">Valid DJI SRT when supplied</text>
    </g>
    <g>
      <rect x="864" y="112" width="246" height="160" rx="18" fill="#f3f0e7"/>
      <circle cx="894" cy="143" r="17" fill="#386e6d"/><text x="894" y="148" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">04</text>
      <g transform="translate(1070 143)" stroke="#386e6d" stroke-width="2" fill="none"><circle cx="-12" cy="-7" r="4"/><circle cx="10" cy="-11" r="4"/><circle cx="13" cy="9" r="4"/><circle cx="-10" cy="12" r="4"/><path d="m-8-7 14-3M11-7l1 12M-7 9l16 1m-20-6-1-7"/></g>
      <text x="886" y="204" fill="#1b2526" font-size="21" font-weight="700">Feature matching</text><text x="886" y="232" fill="#536463" font-size="15">Find shared image detail</text>
    </g>
    <g>
      <rect x="864" y="319" width="246" height="160" rx="18" fill="#f3f0e7"/>
      <circle cx="894" cy="350" r="17" fill="#386e6d"/><text x="894" y="355" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">05</text>
      <g transform="translate(1071 350)" stroke="#386e6d" stroke-width="2" fill="none"><path d="m-18 6 8-14 8 14m-12-7h8m-4 7v11m9-18 9 5v13H1V4Z"/><circle cx="10" cy="9" r="2"/></g>
      <text x="886" y="411" fill="#1b2526" font-size="21" font-weight="700">Camera estimation</text><text x="886" y="439" fill="#536463" font-size="15">Estimate camera positions</text>
    </g>
    <g>
      <rect x="592" y="319" width="246" height="160" rx="18" fill="#f3f0e7"/>
      <circle cx="622" cy="350" r="17" fill="#386e6d"/><text x="622" y="355" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">06</text>
      <g transform="translate(799 350)" fill="#4e8581"><circle cx="-15" cy="4" r="2.5"/><circle cx="-7" cy="-9" r="2.5"/><circle cx="3" cy="-12" r="2.5"/><circle cx="13" cy="-5" r="2.5"/><circle cx="16" cy="7" r="2.5"/><circle cx="5" cy="13" r="2.5"/><circle cx="-7" cy="11" r="2.5"/></g>
      <text x="614" y="411" fill="#1b2526" font-size="21" font-weight="700">Dense reconstruction</text><text x="614" y="439" fill="#536463" font-size="15">Build a scene from images</text>
    </g>
    <g>
      <rect x="320" y="319" width="246" height="160" rx="18" fill="#f3f0e7"/>
      <circle cx="350" cy="350" r="17" fill="#386e6d"/><text x="350" y="355" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">07</text>
      <g transform="translate(527 350)" fill="none" stroke="#386e6d" stroke-width="2"><path d="m-17 1 17-9 17 9L0 10-17 1Zm0 0v13L0 23V10m17-9v13L0 23"/><path d="m-8-3 17 9m0-9L-8 6"/></g>
      <text x="342" y="411" fill="#1b2526" font-size="21" font-weight="700">Mesh + texturing</text><text x="342" y="439" fill="#536463" font-size="15">Surface and appearance</text>
    </g>
    <g>
      <rect x="48" y="319" width="246" height="160" rx="18" fill="#f3f0e7"/>
      <circle cx="78" cy="350" r="17" fill="#386e6d"/><text x="78" y="355" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">08</text>
      <g transform="translate(255 350)" stroke="#386e6d" stroke-width="2" fill="none"><path d="M-17-11h34v23h-34zM-11 5l7-8 5 5 5-6 7 9"/><circle cx="-7" cy="-5" r="2"/></g>
      <text x="70" y="411" fill="#1b2526" font-size="20" font-weight="700">Inspection + export</text><text x="70" y="439" fill="#536463" font-size="15">Explore, measure, download</text>
    </g>
  </g>
  <text x="56" y="548" fill="#b8c9c4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Telemetry alignment is optional. Geographic coordinates do not establish independent survey accuracy.</text>
</svg>
