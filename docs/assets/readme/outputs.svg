    <pattern id="mapgrid" width="23" height="23" patternUnits="userSpaceOnUse"><path d="M23 0H0v23" fill="none" stroke="#96bcb2" stroke-opacity=".38" stroke-width="1"/></pattern>
    <clipPath id="mesh-clip"><rect x="407" y="140" width="306" height="230" rx="12"/></clipPath>
